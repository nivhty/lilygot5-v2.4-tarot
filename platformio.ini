; LilyGO T5 V2.4 (ESP32 + 2.13" 122x250 e-paper) – Tarot card shuffler
; Board docs: https://wiki.lilygo.cc/products/t5-series/t5-epaper-2.13inch/

[env:lilygo_t5_v24]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
    ; Panel variant: DEPG0213BN (default) or GDEM0213B74 (4-gray variant)
    -DPANEL_DEPG0213BN
    ; -DPANEL_GDEM0213B74
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.0
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    bxparks/AceButton @ ^1.10.1

